<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | AgriLink</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

/* ================= PRODUCT FORM ================= */

.product-form{

    display:flex;
    gap:10px;
    flex-wrap:wrap;

    margin-bottom:25px;
}

.product-form input{

    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.product-form button{

    padding:12px 20px;
    border:none;
    border-radius:10px;

    background:#2e7d32;
    color:white;

    cursor:pointer;
}

/* ================= TABLE IMAGE ================= */

.table-img{

    width:70px;
    height:70px;

    object-fit:cover;
    border-radius:10px;
}

/* ================= ACTION BUTTONS ================= */

.action-btn{

    border:none;
    padding:8px 12px;
    margin:3px;

    border-radius:8px;
    cursor:pointer;
}

/* ================= ORDER CARD ================= */

.order-product{

    display:flex;
    align-items:center;
    gap:12px;
}

.order-product img{

    width:60px;
    height:60px;
    object-fit:cover;

    border-radius:10px;
}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <h2 class="logo" onclick="goHome()">
        🌱 AgriLink
    </h2>

    <div class="nav-links">

        <a href="profile.html">
            Profile
        </a>

        <a href="cart.html">
            Cart
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </div>

</nav>

<!-- ================= DASHBOARD ================= -->

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>🌱 AgriLink</h2>

        <ul id="sidebarMenu"></ul>

    </div>

    <!-- MAIN -->

    <div class="dashboard-content">

        <div class="dashboard-header">

            <h1 id="dashboardTitle"></h1>

            <strong id="welcomeText"></strong>

        </div>

        <!-- STATS -->

        <div
            class="stats"
            id="statsContainer"
        ></div>

        <!-- TABLE -->

        <div class="table-container">

            <h2 id="tableTitle"></h2>

            <table id="dataTable"></table>

        </div>

    </div>

</div>

<script src="../js/app.js"></script>
<script src="../js/dashboard.js"></script>

</body>
</html>
