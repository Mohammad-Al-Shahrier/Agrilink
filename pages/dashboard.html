<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | AgriLink</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

/* ================= PRODUCT FORM ================= */

.product-form{

    display:flex;
    gap:10px;
    flex-wrap:wrap;

    margin-bottom:25px;
}

.product-form input{

    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.product-form button{

    padding:12px 20px;
    border:none;
    border-radius:10px;

    background:#2e7d32;
    color:white;

    cursor:pointer;
}

/* ================= TABLE IMAGE ================= */

.table-img{

    width:70px;
    height:70px;

    object-fit:cover;
    border-radius:10px;
}

/* ================= ACTION BUTTONS ================= */

.action-btn{

    border:none;
    padding:8px 12px;
    margin:3px;

    border-radius:8px;
    cursor:pointer;
}

/* ================= ORDER CARD ================= */

.order-product{

    display:flex;
    align-items:center;
    gap:12px;
}

.order-product img{

    width:60px;
    height:60px;
    object-fit:cover;

    border-radius:10px;
}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <h2 class="logo" onclick="goHome()">
        🌱 AgriLink
    </h2>

    <div class="nav-links">

        <a href="profile.html">Profile</a>

        <a href="cart.html">Cart</a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </div>

</nav>

<!-- ================= DASHBOARD ================= -->

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>🌱 AgriLink</h2>

        <ul id="sidebarMenu"></ul>

    </div>

    <!-- MAIN -->

    <div class="dashboard-content">

        <div class="dashboard-header">

            <h1 id="dashboardTitle"></h1>

            <strong id="welcomeText"></strong>

        </div>

        <!-- STATS -->

        <div class="stats" id="statsContainer"></div>

        <!-- TABLE -->

        <div class="table-container">

            <h2 id="tableTitle"></h2>

            <table id="dataTable"></table>

        </div>

    </div>

</div>

<script src="../js/app.js"></script>

<script>

// ================= LOGIN CHECK =================

const user =
    JSON.parse(localStorage.getItem("currentUser"));

if(!user){

    alert("Login first!");

    location.href = "login.html";
}

// ================= DOM =================

const sidebar =
    document.getElementById("sidebarMenu");

const title =
    document.getElementById("dashboardTitle");

const welcome =
    document.getElementById("welcomeText");

const stats =
    document.getElementById("statsContainer");

const table =
    document.getElementById("dataTable");

const tableTitle =
    document.getElementById("tableTitle");

// ================= SIDEBAR =================

if(user.role === "farmer"){

    sidebar.innerHTML = `

        <li>
            <a href="#" onclick="showProducts()">
                My Products
            </a>
        </li>

        <li>
            <a href="#" onclick="showOrders()">
                Orders
            </a>
        </li>

        <li>
            <a href="profile.html">
                Profile
            </a>
        </li>

        <li>
            <a href="#" onclick="logout()">
                Logout
            </a>
        </li>
    `;

} else {

    sidebar.innerHTML = `

        <li>
            <a href="#" onclick="showOrders()">
                My Orders
            </a>
        </li>

        <li>
            <a href="profile.html">
                Profile
            </a>
        </li>

        <li>
            <a href="#" onclick="logout()">
                Logout
            </a>
        </li>
    `;
}

// ================= LOAD DASHBOARD =================

loadDashboard();

function loadDashboard(){

    if(user.role === "farmer"){

        title.innerText =
            "Farmer Dashboard";

        welcome.innerText =
            "Welcome Farmer 👨‍🌾";

        showProducts();

    } else {

        title.innerText =
            "Customer Dashboard";

        welcome.innerText =
            `Welcome ${user.name} 👤`;

        showOrders();
    }
}

// ================= STORAGE =================

function getProducts(){

    return JSON.parse(
        localStorage.getItem("products")
    ) || [];
}

// ================= SHOW PRODUCTS =================

function showProducts(){

    const products = getProducts();

    tableTitle.innerText =
        "My Products";

    stats.innerHTML = `

        <div class="stat-card">

            <h3>Total Products</h3>

            <p>${products.length}</p>

        </div>
    `;

    table.innerHTML = `

        <!-- FORM -->

        <div class="product-form">

            <input
                id="pname"
                placeholder="Product Name"
            >

            <input
                id="pprice"
                placeholder="Price"
            >

            <input
                type="file"
                id="pimage"
            >

            <button onclick="addProduct()">
                ➕ Add Product
            </button>

        </div>

        <!-- TABLE -->

        <thead>

            <tr>

                <th>Image</th>

                <th>Name</th>

                <th>Price</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody>

            ${products.map((p, i) => `

                <tr>

                    <td>
                        <img
                            src="${p.image}"
                            class="table-img"
                        >
                    </td>

                    <td>${p.pname}</td>

                    <td>${p.price}৳</td>

                    <td>

                        <button
                            class="action-btn"
                            onclick="editProduct(${i})"
                        >
                            ✏️
                        </button>

                        <button
                            class="action-btn"
                            onclick="deleteProduct(${i})"
                        >
                            🗑️
                        </button>

                        <button
                            class="action-btn"
                            onclick="changeImage(${i})"
                        >
                            🖼️
                        </button>

                    </td>

                </tr>

            `).join("")}

        </tbody>
    `;
}

// ================= ADD PRODUCT =================

function addProduct(){

    const name =
        document.getElementById("pname").value;

    const price =
        document.getElementById("pprice").value;

    const file =
        document.getElementById("pimage").files[0];

    if(!name || !price || !file){

        alert("All fields required!");

        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        let products = getProducts();

        products.push({

            pname: name,

            price: price,

            image: e.target.result
        });

        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );

        showProducts();
    };

    reader.readAsDataURL(file);
}

// ================= EDIT PRODUCT =================

function editProduct(index){

    let products = getProducts();

    const newName = prompt(
        "Edit product name",
        products[index].pname
    );

    const newPrice = prompt(
        "Edit product price",
        products[index].price
    );

    if(!newName || !newPrice) return;

    products[index].pname = newName;

    products[index].price = newPrice;

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

    showProducts();
}

// ================= DELETE PRODUCT =================

function deleteProduct(index){

    let products = getProducts();

    if(!confirm("Delete product?")) return;

    products.splice(index,1);

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

    showProducts();
}

// ================= CHANGE IMAGE =================

function changeImage(index){

    const input =
        document.createElement("input");

    input.type = "file";

    input.onchange = function(){

        const file = input.files[0];

        const reader = new FileReader();

        reader.onload = function(e){

            let products = getProducts();

            products[index].image =
                e.target.result;

            localStorage.setItem(
                "products",
                JSON.stringify(products)
            );

            showProducts();
        };

        reader.readAsDataURL(file);
    };

    input.click();
}

// ================= SHOW ORDERS =================

function showOrders(){

    tableTitle.innerText =
        "Orders";

    let orders =
        JSON.parse(localStorage.getItem("orders"))
        || [];

    // CUSTOMER ONLY OWN ORDERS
    if(user.role === "customer"){

        orders = orders.filter(order =>
            order.userEmail === user.email
        );
    }

    // TOTAL PRICE
    const totalSpent =
        orders.reduce((sum, order) => {

            return sum + Number(order.total || 0);

        }, 0);

    // TOTAL QTY
    const totalQty =
        orders.reduce((sum, order) => {

            return sum + Number(order.qty || 0);

        }, 0);

    // STATS
    stats.innerHTML = `

        <div class="stat-card">

            <h3>Total Orders</h3>

            <p>${orders.length}</p>

        </div>

        <div class="stat-card">

            <h3>Total Quantity</h3>

            <p>${totalQty}</p>

        </div>

        <div class="stat-card">

            <h3>Total Spent</h3>

            <p>৳ ${totalSpent}</p>

        </div>
    `;

    // TABLE
    table.innerHTML = `

        <thead>

            <tr>

                <th>Product</th>

                <th>Qty</th>

                <th>Total</th>

                <th>Status</th>

                <th>Date</th>

            </tr>

        </thead>

        <tbody>

            ${orders.map(order => `

                <tr>

                    <td>

                        <div class="order-product">

                            <img
                                src="${order.image}"
                            >

                            <span>
                                ${order.pname}
                            </span>

                        </div>

                    </td>

                    <td>
                        ${order.qty}
                    </td>

                    <td>
                        ৳ ${order.total}
                    </td>

                    <td>
                        ${order.status || "Pending"}
                    </td>

                    <td>
                        ${order.date || "-"}
                    </td>

                </tr>

            `).join("")}

        </tbody>
    `;
}

</script>

</body>
</html>
