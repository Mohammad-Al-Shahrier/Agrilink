<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | AgriLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    /* Standalone page — reuses dashboard.css component classes
       (stat-card, order-card, status-pill, empty-orders …) without
       the sidebar/.dash-main grid layout that page was built for. */
    .orders-page {
      width: 92%;
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 0 100px;
      min-height: 60vh;
    }
    .orders-page .panel-header { margin-bottom: 28px; }
    .orders-page .stats-grid { margin-bottom: 32px; }
    .orders-page .orders-list { display: flex; flex-direction: column; gap: 18px; }
    .orders-loading, .orders-empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted, #667);
    }
    .orders-empty .empty-icon { font-size: 44px; margin-bottom: 14px; }
    .orders-empty a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 26px;
      background: #176b1c;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
    }
    #statusToast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1b5e20;
      color: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      font-size: 14px;
      font-weight: 600;
      max-width: 320px;
      z-index: 999;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
    }
    #statusToast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
  <h2 class="logo" onclick="goHome()">🌱 AgriLink</h2>
  <div class="nav-links">
    <a href="../index.html">Home</a>
    <a href="orders.html" class="active">My Orders</a>
    <a href="cart.html" class="cart-link">Cart</a>
    <a href="profile.html">Profile</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</nav>

<main class="orders-page">

  <div class="panel-header">
    <div>
      <p class="panel-eyebrow">Your purchase history</p>
      <h1 class="panel-title">My Orders 🧾</h1>
    </div>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card" style="--accent:#2e7d32">
      <div class="stat-icon">🧾</div>
      <div class="stat-body">
        <span class="stat-label">Total Orders</span>
        <span class="stat-val" id="statOrderCount">—</span>
      </div>
    </div>
    <div class="stat-card" style="--accent:#1565c0">
      <div class="stat-icon">⏳</div>
      <div class="stat-body">
        <span class="stat-label">Pending / In Progress</span>
        <span class="stat-val" id="statPending">—</span>
      </div>
    </div>
    <div class="stat-card" style="--accent:#6a1b9a">
      <div class="stat-icon">৳</div>
      <div class="stat-body">
        <span class="stat-label">Total Spent</span>
        <span class="stat-val" id="statSpent">—</span>
      </div>
    </div>
  </div>

  <div id="ordersWrap" class="orders-list">
    <div class="orders-loading">Loading your orders…</div>
  </div>

</main>

<div id="statusToast"></div>

<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>

<script>
/* =====================================================
   MY ORDERS — customer order history
   Mirrors the order-card markup/classes used on the
   farmer dashboard (dashboard.css) so both look consistent.
===================================================== */

const API   = `${window.API_BASE || "http://localhost:5000"}/api`;
const TOKEN = localStorage.getItem("token");

if (!currentUser) {
  window.location.href = "login.html";
} else if (currentUser.role === "farmer") {
  // Farmers manage orders from the full dashboard instead
  window.location.href = "dashboard.html";
} else if (currentUser.role === "admin") {
  // Admins approve/manage every order from the admin dashboard
  window.location.href = "admin.html";
}

function taka(n) { return `৳${Number(n || 0).toLocaleString("en-BD")}`; }
function unitLabel(u) { return u === "piece" ? "piece" : "kg"; }

function buildImageUrl(img) {
  if (!img) return "../images/placeholder.jpg";
  if (img.startsWith("http://") || img.startsWith("https://")) return img;
  const clean = img.replace(/^\/+/, "");
  if (clean.startsWith("uploads/")) return `${window.API_BASE || "http://localhost:5000"}/${clean}`;
  return `${window.API_BASE || "http://localhost:5000"}/uploads/${clean}`;
}

/* Remembers each order's last-seen status so a poll can detect
   changes (e.g. farmer/admin marking an order "delivered") and
   surface them to the customer without a manual refresh. */
let _lastKnownStatus = {};

function showStatusToast(message) {
  const toast = document.getElementById("statusToast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showStatusToast._t);
  showStatusToast._t = setTimeout(() => toast.classList.remove("show"), 5000);
}

const STATUS_LABEL = {
  pending: "is pending confirmation",
  confirmed: "has been confirmed",
  delivered: "has been delivered 🎉",
  cancelled: "was cancelled"
};

async function loadMyOrders(isPoll = false) {
  const wrap = document.getElementById("ordersWrap");

  try {
    const res  = await fetch(`${API}/orders/my-orders`, {
      headers: { Authorization: `Bearer ${TOKEN}` }
    });
    const data   = await res.json();
    const orders = data.orders || [];

    /* Diff against last-seen statuses to auto-notify on change —
       this is what makes "order status auto-updates" visible to the
       customer instead of them having to refresh the page. */
    orders.forEach(order => {
      const prev = _lastKnownStatus[order._id];
      const curr = (order.status || "pending").toLowerCase();
      if (isPoll && prev && prev !== curr) {
        const shortId = String(order._id).slice(-6).toUpperCase();
        showStatusToast(`📦 Order #${shortId} ${STATUS_LABEL[curr] || `is now "${curr}"`}`);
      }
      _lastKnownStatus[order._id] = curr;
    });

    const pending = orders.filter(o => ["pending", "confirmed"].includes((o.status || "").toLowerCase())).length;
    const spent   = orders.reduce((sum, o) => sum + Number(o.totalAmount || 0), 0);

    document.getElementById("statOrderCount").textContent = orders.length;
    document.getElementById("statPending").textContent    = pending;
    document.getElementById("statSpent").textContent      = taka(spent);

    if (!orders.length) {
      wrap.innerHTML = `
        <div class="orders-empty">
          <div class="empty-icon">🛍️</div>
          <h3>You haven't placed any orders yet</h3>
          <p>Browse fresh produce straight from local farmers.</p>
          <a href="../index.html">🌿 Start Shopping</a>
        </div>`;
      return;
    }

    wrap.innerHTML = orders.map(order => {
      const statusClass = {
        pending:   "pill-amber",
        confirmed: "pill-green",
        delivered: "pill-green",
        cancelled: "pill-red"
      }[(order.status || "").toLowerCase()] || "pill-amber";

      return `
        <div class="order-card">
          <div class="order-card-header">
            <div>
              <span class="order-id">#${String(order._id).slice(-6).toUpperCase()}</span>
              <span class="order-date">${new Date(order.createdAt || Date.now()).toLocaleDateString("en-BD")}</span>
            </div>
            <span class="status-pill ${statusClass}">${order.status || "Pending"}</span>
          </div>
          <div class="order-items">
            ${(order.items || []).map(item => `
              <div class="order-item-row">
                <img src="${buildImageUrl(item.productId?.image)}" alt=""
                  onerror="this.src='../images/placeholder.jpg';this.onerror=null;">
                <div class="order-item-info">
                  <span>${item.productId?.pname || "Product"}</span>
                  <span class="order-item-qty">× ${item.quantity} ${unitLabel(item.productId?.unit)}</span>
                </div>
                <span class="order-item-price">${taka(item.price * item.quantity)}</span>
              </div>`).join("")}
          </div>
          <div class="order-card-footer">
            <span class="order-customer">📍 ${order.shippingAddress || "—"}</span>
            <span class="order-total">${taka(order.totalAmount)}</span>
          </div>
        </div>`;
    }).join("");

  } catch (err) {
    console.error("Load orders error:", err);
    wrap.innerHTML = `<div class="orders-empty"><div class="empty-icon">⚠️</div><h3>Couldn't load your orders</h3><p>Please check your connection and try again.</p></div>`;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadMyOrders(false);
  // Poll for status changes (e.g. "delivered") every 15s.
  setInterval(() => loadMyOrders(true), 15000);
});
</script>

</body>
</html>
